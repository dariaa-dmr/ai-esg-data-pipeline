# Copy this file to config.ini only in a local working directory.
# Never commit real credentials. The code also supports environment variables:
# DADATA_TOKEN, DADATA_SECRET, YANDEX_GEOCODER_KEY.

[paths]
incoming = incoming
retry = retry
clean = clean
dirty = dirty
enriched = enriched
geo = geo
final = final
archive = archive
logs = logs
cache = cache
backup_source = backup/source

[api]
dadata_token =
dadata_secret =
yandex_geocoder_key =
retries = 3
retry_delay_sec = 2.0
dadata_request_delay_sec = 0.2
yandex_request_delay_sec = 0.2

[pipeline]
chunksize = 10
save_every = 5

[scripts]
use_existing_scripts = false
dadata_script = validate_one_file_safe.py
yandex_script = fill_geo_yandex.py

[normalization]
keep_status = all
split_by_status = true
site_blacklist = spark-interfax.ru,list-org.com,rusprofile.ru,checko.ru
