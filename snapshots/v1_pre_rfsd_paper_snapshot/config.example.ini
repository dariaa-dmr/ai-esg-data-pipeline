[paths]
incoming = incoming
retry = retry
clean = clean
dirty = dirty
review = review
enriched = enriched
geo = geo
final = final
reports = final/reports
export_by_category = final/export_by_category
archive = archive
logs = logs
cache = cache
backup_source = backup/source
secrets = secrets
cache_db = cache/api_cache.sqlite
description_cache_db = cache/descriptions.sqlite
missing_geo = logs/missing_geo.csv

[api]
dadata_token =
dadata_secret =
yandex_geocoder_key =
retries = 3
retry_delay_sec = 2.0
dadata_request_delay_sec = 0.2
yandex_request_delay_sec = 0.2

[pipeline]
chunksize = 100
save_every = 25

[scripts]
use_existing_scripts = false
dadata_script = validate_one_file_safe.py
yandex_script = fill_geo_yandex.py

[references]
regions_csv = references/regions.csv

[normalization]
keep_status = all
split_by_status = true
site_blacklist = spark-interfax.ru,list-org.com,rusprofile.ru,checko.ru,zachestnyibiznes.ru,sbis.ru

[descriptions]
description_mode = llm_from_existing_fields
input_csv = final/all_sectors_final_active_spark_included.csv
fallback_input_csv = final/all_sectors_final_active.csv
output_csv = final/all_sectors_final_active_described.csv

[yandexgpt]
token =
folder_id =
auth_type = Bearer
model_uri =
endpoint = https://llm.api.cloud.yandex.net/foundationModels/v1/completion
temperature = 0.2
max_tokens = 900
retries = 3
retry_delay_sec = 2.0
request_delay_sec = 0.2
timeout_sec = 60

[export]
# input_mode: auto | active | spark_included | described | custom
input_mode = auto
input_csv = final/all_sectors_final_active_described.csv
fallback_input_csv = final/all_sectors_final_active.csv
export_include_federal_district = false
clear_output = true


[spark]
spark_mode = manual
request_dir = spark/request
incoming_dir = spark/incoming
unpacked_dir = spark/unpacked
extracted_csv = spark/extracted/spark_extracted.csv
active_input_csv = final/all_sectors_final_active.csv
inactive_input_csv = final/all_sectors_final_inactive.csv
matched_csv = final/all_sectors_final_active_spark.csv
included_csv = final/all_sectors_final_active_spark_included.csv
excluded_csv = final/all_sectors_final_active_spark_excluded.csv
review_csv = final/review/size_filter_unknown/size_filter_unknown.csv
reports_dir = spark/reports
excluded_root = final/excluded
review_root = final/review
min_employees = 100
min_revenue_rub = 1000000

[manual_overrides]
routing_overrides_csv = manual_overrides/routing_overrides.csv
company_fields_overrides_csv = manual_overrides/company_fields_overrides.csv
